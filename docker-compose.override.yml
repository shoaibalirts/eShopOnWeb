version: '3.4'
services:
 eshopwebmvc:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - ConnectionStrings__seq=http://seq
     - Seq__ServerUrl=http://seq
     # Rollback switch: STOCK_CHECK_ENABLED=false docker compose up -d eshopwebmvc
     - StockCheck__Enabled=${STOCK_CHECK_ENABLED:-true}
     - RabbitMq__HostName=rabbitmq
     - RabbitMq__UserName=eshop
     - RabbitMq__Password=eshop
   # No host port: the shop is only reachable through the gateway on http://localhost:5000.
   volumes:
     - ~/.aspnet/https:/root/.aspnet/https:ro
     - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
 eshoppublicapi:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
   ports:
     - "5200:8080"
   volumes:
     - ~/.aspnet/https:/root/.aspnet/https:ro
     - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
 inventory-api:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ConnectionStrings__InventoryDb=Server=sqlserver,1433;Initial Catalog=InventoryDb;User Id=sa;Password=@someThingComplicated1234;TrustServerCertificate=true;
     - Seq__ServerUrl=http://seq
     - RabbitMq__HostName=rabbitmq
     - RabbitMq__UserName=eshop
     - RabbitMq__Password=eshop
   # No host port: Inventory is only reachable through the gateway (/api/inventory/*).
 gateway:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     # Must match AuthorizationConstants.JWT_SECRET_KEY in the monolith. Override it with JWT_SIGNING_KEY.
     - Jwt__SigningKey=${JWT_SIGNING_KEY:-SecretKeyOfDoomThatMustBeAMinimumNumberOfBytes}
     - Seq__ServerUrl=http://seq
   ports:
     - "5000:8080"