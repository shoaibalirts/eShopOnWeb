version: '3.4'

services:
  eshopwebmvc:
    image: ${DOCKER_REGISTRY-}eshopwebmvc
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    # The web shop seeds and migrates CatalogDb at startup, so it waits for SQL Server.
    # It doesn't wait for RabbitMQ: StockResultConsumer retries, so the shop runs without it.
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      - "sqlserver"
  gateway:
    image: ${DOCKER_REGISTRY-}gateway
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    depends_on:
      - eshopwebmvc
      - inventory-api
      - inventory-api-2
      - seq
  # Two replicas of Inventory. The gateway sends HTTP calls round-robin to both, and both consume
  # the same RabbitMQ queue (Competing Consumers).
  inventory-api:
    image: ${DOCKER_REGISTRY-}inventory-api
    build:
      context: .
      dockerfile: src/Inventory.Api/Dockerfile
    hostname: inventory-1
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    # Healthy when Kestrel listens, which is after MigrateAsync has finished. The image has no curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
  inventory-api-2:
    image: ${DOCKER_REGISTRY-}inventory-api
    build:
      context: .
      dockerfile: src/Inventory.Api/Dockerfile
    hostname: inventory-2
    # Waits for replica 1, so the two don't run the database migration at the same time.
    depends_on:
      inventory-api:
        condition: service_healthy
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # 1434 on the host, because 1433 is often taken by a local SQL Server.
    ports:
      - "1434:1433"
    environment:
      - SA_PASSWORD=@someThingComplicated1234
      - ACCEPT_EULA=Y
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    # The default guest user may only connect from localhost, so the containers need their own user.
    environment:
      - RABBITMQ_DEFAULT_USER=eshop
      - RABBITMQ_DEFAULT_PASS=eshop
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  seq:
    image: datalust/seq:2026.1
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true

